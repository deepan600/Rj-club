<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJ Club Quiz</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#182238;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;font-size:24px}.brand small{display:block;font-size:12px;color:#737d90}.card{background:#fff;border:1px solid #dde2ea;border-radius:12px;padding:24px;box-shadow:0 8px 25px #16213a0d}.auth{max-width:450px;margin:7vh auto}label{display:block;font-size:13px;font-weight:bold;margin:15px 0 6px}.field{width:100%;padding:13px;border:1px solid #cbd2dd;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer;background:#3157a4;color:#fff}.full{width:100%;margin-top:20px}.link{border:0;background:none;color:#3157a4;font-weight:bold}.hide{display:none}.muted{color:#747e90}.code{font-size:30px;font-weight:900;letter-spacing:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.opt{padding:15px;border:1px solid #ccd3df;border-radius:9px;background:#fff;text-align:left;font-weight:bold}.selected{background:#edf2ff;border:2px solid #3157a4}.correct{background:#e8f7ee;border-color:#198754}.wrong{background:#fff0f0;border-color:#c43b3b}.timer{font-size:35px;font-weight:900}.question{font-size:25px;font-weight:800;margin:18px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tools button{padding:10px}.list>div{padding:10px 0;border-bottom:1px solid #edf0f4}.center{text-align:center;padding:35px 5px}@media(max-width:600px){.opts{grid-template-columns:1fr}.wrap{padding:14px}.question{font-size:21px}}
</style></head><body><div class="wrap"><header class="head"><div class="brand">RJ CLUB<small>QUIZ CHALLENGE</small></div><button id="switch" class="link">Host Login</button></header>
<section id="join" class="card auth"><h2>Join Quiz</h2><p class="muted">Enter your details to participate.</p><label>Name</label><input id="name" class="field"><label>Department</label><select id="dept" class="field"><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>AI & DS</option></select><label>Quiz Code</label><input id="code" class="field"><button id="joinBtn" class="btn full">JOIN QUIZ</button><p id="joinMsg" class="muted"></p></section>
<section id="login" class="card auth hide"><h2>Host Login</h2><label>Username</label><input id="user" class="field"><label>Password</label><input id="pass" type="password" class="field"><button id="loginBtn" class="btn full">LOGIN</button><p id="loginMsg" class="muted"></p></section>
<section id="host" class="hide"><div class="card"><div class="row"><div><small class="muted">QUIZ CODE</small><div id="hostCode" class="code"></div></div><div><b id="count">0</b> participants</div></div><h2>Create Question</h2><label>Question</label><textarea id="q" class="field"></textarea><div class="opts"><input id="a" class="field" placeholder="Option A"><input id="b" class="field" placeholder="Option B"><input id="c" class="field" placeholder="Option C"><input id="d" class="field" placeholder="Option D"></div><label>Correct answer</label><select id="correct" class="field"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><div class="tools"><button id="add" class="btn">Add Question</button><button id="start" class="btn">Start</button><button id="answer" class="btn">Show Answer</button><button id="board" class="btn">Leaderboard</button><button id="next" class="btn">Next Question</button></div><h3>Participants</h3><div id="people" class="list"></div><h3>Questions: <span id="qcount">0</span></h3></div></section>
<section id="player" class="hide"><div class="card"><div class="row"><div><b id="pname"></b><div id="pdept" class="muted"></div></div><div><small class="muted">POINTS</small><div id="score" style="font-size:24px;font-weight:900">0</div></div></div><div id="content" class="center"><h2>You're in!</h2><p class="muted">Waiting for host...</p></div></div></section></div>
<script>
const $=x=>document.getElementById(x),K='rjclubdemo';let me=null,t;
const channel='BroadcastChannel'in window?new BroadcastChannel('rjclub'):null;
function init(){if(!localStorage[K])save({code:String(Math.floor(100000+Math.random()*900000)),qs:[],ps:[],i:-1,phase:'waiting',at:Date.now()})}
function load(){return JSON.parse(localStorage[K])}function save(s){localStorage[K]=JSON.stringify(s);channel&&channel.postMessage(1);render()}
function view(v){['join','login','host','player'].forEach(x=>$(x).classList.toggle('hide',x!==v))}
$('switch').onclick=()=>{view('login');$('switch').textContent='Participant Join'};$('loginBtn').onclick=()=>{if($('user').value==='DEEPAN63'&&$('pass').value==='DEEPAN+33'){view('host');render()}else $('loginMsg').textContent='Invalid login'};
$('joinBtn').onclick=()=>{let s=load(),n=$('name').value.trim(),d=$('dept').value;if(!n||!d||$('code').value.trim()!==s.code){$('joinMsg').textContent='Check name, department and quiz code.';return}me={id:String(Date.now()+Math.random()),name:n,dept:d};s.ps.push({...me,score:0,ans:{}});save(s);view('player')};
$('add').onclick=()=>{let s=load(),o=[$('a').value,$('b').value,$('c').value,$('d').value];if(!$('q').value.trim()||o.some(x=>!x.trim()))return alert('Complete question and options');s.qs.push({q:$('q').value.trim(),o,correct:+$('correct').value});save(s);['q','a','b','c','d'].forEach(x=>$(x).value='')};
$('start').onclick=()=>{let s=load();if(!s.qs.length)return alert('Add a question');s.i=0;s.phase='read';s.at=Date.now();save(s)};$('answer').onclick=()=>{let s=load();s.phase='answer';s.at=Date.now();save(s)};$('board').onclick=()=>{let s=load();s.phase='board';save(s)};$('next').onclick=()=>{let s=load();if(s.i+1<s.qs.length){s.i++;s.phase='read';s.at=Date.now()}else s.phase='board';save(s)};
function choose(x){let s=load(),p=s.ps.find(p=>p.id===me.id);if(!p||p.ans[s.i]!=null)return;let sec=(Date.now()-s.at)/1000,q=s.qs[s.i],pts=x===q.correct&&sec<=20?Math.max(1,11-Math.ceil(sec/2)):0;p.ans[s.i]={x,pts};p.score+=pts;save(s)}
function render(){let s=load();$('hostCode').textContent=s.code;$('count').textContent=s.ps.length;$('qcount').textContent=s.qs.length;$('people').innerHTML=s.ps.map(p=>'<div class="row"><span>'+p.name+' <small class="muted">'+p.dept+'</small></span><b>'+p.score+'</b></div>').join('');if(!me)return;let p=s.ps.find(x=>x.id===me.id);if(!p)return;$('pname').textContent=p.name;$('pdept').textContent=p.dept;$('score').textContent=p.score;if(s.i<0){$('content').innerHTML='<div class="center"><h2>Joined Successfully</h2><p class="muted">Waiting for host to start...</p></div>';return}let q=s.qs[s.i],elapsed=(Date.now()-s.at)/1000;if(s.phase==='read'){let l=Math.max(0,5-Math.floor(elapsed));$('content').innerHTML='<div class="timer">'+l+'</div><div class="question">'+q.q+'</div><p class="muted">Read the question. Options appear after 5 seconds.</p>';if(l<=0){s.phase='options';s.at=Date.now();save(s)}else tick();return}if(s.phase==='options'){let l=Math.max(0,30-Math.floor(elapsed)),a=p.ans[s.i];$('content').innerHTML='<div class="timer">'+l+'</div><div class="question">'+q.q+'</div><div class="opts">'+q.o.map((o,i)=>'<button '+(a?'disabled':'')+' onclick="choose('+i+')" class="opt '+(a&&a.x===i?'selected':'')+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div>';if(l<=0){s.phase='locked';save(s)}else tick();return}if(s.phase==='locked'){$('content').innerHTML='<div class="center"><h2>Time is up</h2><p>Waiting for host...</p></div>';return}if(s.phase==='answer'){let a=p.ans[s.i];$('content').innerHTML='<div class="question">'+q.q+'</div><div class="opts">'+q.o.map((o,i)=>'<button disabled class="opt '+(i===q.correct?'correct':a&&a.x===i?'wrong':'')+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><p><b>'+(a&&a.x===q.correct?'Correct +'+a.pts+' points':'0 points')+'</b></p>';return}if(s.phase==='board'){let rows=[...s.ps].sort((a,b)=>b.score-a.score);$('content').innerHTML='<h2>Leaderboard</h2><div class="list">'+rows.map((x,i)=>'<div class="row"><span>#'+(i+1)+' '+x.name+'</span><b>'+x.score+' pts</b></div>').join('')+'</div><p class="muted">Waiting for host...</p>'}}
function tick(){clearTimeout(t);t=setTimeout(render,250)}window.addEventListener('storage',render);if(channel)channel.onmessage=render;init();render();
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJ Club AEC | Quiz Challenge</title>
<meta name="description" content="RJ Club AEC official realtime quiz challenge website.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://rjclub.vercel.app/">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#121722;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.hide{display:none!important}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.logo{font-size:24px;font-weight:900}.logo b{color:#e92332}.sub{font-size:11px;letter-spacing:1.5px;color:#727987}.card{background:#fff;border:1px solid #e0e3e8;border-radius:14px;padding:24px;box-shadow:0 8px 28px #1118270b}.auth{max-width:450px;margin:7vh auto}.field{width:100%;border:1px solid #cdd2da;border-radius:9px;padding:13px;background:#fff;margin:6px 0 12px}.btn{border:0;border-radius:9px;padding:12px 17px;background:#ed2434;color:white;font-weight:800;cursor:pointer}.btn.dark{background:#151c29}.btn.ghost{background:white;color:#172033;border:1px solid #ccd2dc}.btn:disabled{opacity:.45;cursor:not-allowed}.link{border:0;background:none;color:#e92332;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.quizcard{cursor:pointer;transition:.15s}.quizcard:hover{transform:translateY(-2px);border-color:#e92332}.quizcard h3{margin:9px 0}.muted{color:#747d8d}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}.opt{border:1px solid #364152;border-radius:10px;padding:15px;background:#151e2d;color:white;font-weight:750}.selected{outline:2px solid #45a2ff}.correct{background:#11844d!important}.wrong{background:#a92935!important}.viewer{background:#0d1523;color:white;border-radius:15px;padding:36px;min-height:430px;text-align:center}.viewer .question{font-size:38px;font-weight:900;margin:55px auto 35px;max-width:900px}.timer{font-size:50px;font-weight:900}.code{font-size:34px;font-weight:900;letter-spacing:7px}.list>div{padding:11px;border-bottom:1px solid #e8ebef}.podium{display:flex;justify-content:center;align-items:end;gap:12px;margin:25px 0}.pod{width:130px;padding:18px 8px;border-radius:12px 12px 4px 4px;background:#1d2a3c}.pod.first{min-height:150px;background:#7c5c08}.nav{display:flex;gap:8px}.qedit{border-top:1px solid #eee;padding-top:18px;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.shell{padding:13px}.viewer{padding:20px}.viewer .question{font-size:27px}.top{align-items:flex-start}}
</style></head><body><main class="shell"><header class="top"><div class="logo">RJ <b>CLUB</b><div class="sub">QUIZ CHALLENGE</div></div><div class="nav"><button id="homeBtn" class="link">Home</button><button id="hostNav" class="btn">Host Login</button><button id="logout" class="link hide">Logout</button></div></header>

<section id="home" class="card auth"><h1>Join Quiz</h1><p class="muted">Enter your details to participate.</p><input id="name" class="field" placeholder="Your Name"><select id="dept" class="field"><option value="">Select Department</option><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>AI & DS</option></select><input id="joinCode" class="field" placeholder="Quiz Code"><button id="joinBtn" class="btn" style="width:100%">JOIN QUIZ</button><p id="joinMsg" class="muted"></p></section>

<section id="login" class="card auth hide"><h1>Host Login</h1><input id="email" type="email" class="field" placeholder="Email"><input id="password" type="password" class="field" placeholder="Password"><button id="loginBtn" class="btn" style="width:100%">LOGIN</button><p>New to RJ Club? <button id="openRegister" class="link">Register</button></p><p id="loginMsg" class="muted"></p></section>
<section id="register" class="card auth hide"><h1>Create Host Account</h1><input id="regEmail" type="email" class="field" placeholder="Email"><input id="regPass" type="password" class="field" placeholder="Password (6+ characters)"><button id="regBtn" class="btn" style="width:100%">REGISTER</button><p>Already registered? <button id="backLogin" class="link">Login</button></p><p id="regMsg" class="muted"></p></section>

<section id="dashboard" class="hide"><div class="row"><div><h1>My Quizzes</h1><p class="muted">Create, edit and run your saved quizzes.</p></div><button id="createBtn" class="btn">+ Create New Quiz</button></div><div id="quizGrid" class="grid"></div></section>

<section id="editor" class="card hide"><div class="row"><h1 id="editorTitle">Create New Quiz</h1><button id="backDash1" class="btn ghost">Back</button></div><label>Quiz Title</label><input id="quizTitle" class="field"><label>Description</label><textarea id="quizDesc" class="field"></textarea><div class="opts"><div><label>Category</label><input id="quizCat" class="field"></div><div><label>Answer Time</label><select id="quizTime" class="field"><option value="20">20 seconds</option><option value="30" selected>30 seconds</option><option value="45">45 seconds</option></select></div></div><button id="saveMeta" class="btn">Save Quiz</button><div id="questionEditor" class="qedit hide"><h2>Add Question</h2><textarea id="qText" class="field" placeholder="Question"></textarea><div class="opts"><input id="oa" class="field" placeholder="Option A"><input id="ob" class="field" placeholder="Option B"><input id="oc" class="field" placeholder="Option C"><input id="od" class="field" placeholder="Option D"></div><select id="correct" class="field"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button id="addQ" class="btn">+ Add Question</button><h3>Questions (<span id="qCount">0</span>)</h3><div id="qList" class="list"></div></div><p id="editMsg" class="muted"></p></section>

<section id="control" class="hide"><div class="row"><div><button id="backDash2" class="link">← My Quizzes</button><h1 id="controlTitle"></h1></div><div class="tools"><button id="editQuiz" class="btn ghost">Edit Quiz</button><button id="deleteQuiz" class="btn ghost">Delete</button></div></div><div class="card"><div class="row"><div><div class="muted">QUIZ CODE</div><div id="controlCode" class="code"></div></div><div><b id="participantCount">0</b> Participants</div></div><div class="tools"><button id="showViewer" class="btn dark">Show Viewer</button><button id="startQuiz" class="btn">Start Quiz</button><button id="prevQ" class="btn ghost hide">Previous</button><button id="showAnswer" class="btn hide">Show Answer</button><button id="showBoard" class="btn dark hide">Show Leaderboard</button><button id="nextQ" class="btn hide">Next Question</button></div><div id="viewer" class="viewer hide"></div><h3>Participants</h3><div id="participantList" class="list"></div></div></section>

<section id="player" class="hide"><div class="card"><div class="row"><div><b id="playerName"></b><div id="playerDept" class="muted"></div></div><div><span class="muted">POINTS</span> <b id="playerScore">0</b></div></div><div id="playerView" class="viewer"></div></div></section>
</main><script>
const $=x=>document.getElementById(x),sb=supabase.createClient(RJ_SUPABASE_URL,RJ_SUPABASE_KEY);
let user=null,quiz=null,questions=[],participants=[],me=null,myAnswer=null,channel=null,tickTimer=null,editing=null;
const screens=['home','login','register','dashboard','editor','control','player'];
function view(v){screens.forEach(x=>$(x).classList.toggle('hide',x!==v))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('homeBtn').onclick=()=>view('home');$('hostNav').onclick=()=>view('login');$('openRegister').onclick=()=>view('register');$('backLogin').onclick=()=>view('login');
$('regBtn').onclick=async()=>{let {error}=await sb.auth.signUp({email:$('regEmail').value.trim(),password:$('regPass').value,options:{emailRedirectTo:location.origin}});$('regMsg').textContent=error?error.message:'Registered. If email confirmation is enabled, confirm your email, then login.'};
$('loginBtn').onclick=async()=>{let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').textContent=error.message;user=data.user;hostUI();await loadDashboard()};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;$('logout').classList.add('hide');$('hostNav').classList.remove('hide');view('home')};
function hostUI(){$('logout').classList.remove('hide');$('hostNav').classList.add('hide')}
async function loadDashboard(){view('dashboard');let {data,error}=await sb.from('rj_quizzes').select('*').eq('host_user',user.id).order('updated_at',{ascending:false});if(error)return;$('quizGrid').innerHTML=(data||[]).map(q=>'<article class="card quizcard" onclick="openQuiz(\''+q.id+'\')"><div class="muted">'+esc(q.category||'Quiz')+'</div><h3>'+esc(q.title)+'</h3><div class="muted">Code '+esc(q.code)+' · '+esc(q.status)+'</div></article>').join('')||'<div class="card"><b>No quizzes yet.</b><p class="muted">Create your first quiz.</p></div>'}
$('createBtn').onclick=()=>openEditor(null);$('backDash1').onclick=loadDashboard;$('backDash2').onclick=loadDashboard;
async function openEditor(id){editing=id;view('editor');$('questionEditor').classList.toggle('hide',!id);$('editMsg').textContent='';if(!id){$('editorTitle').textContent='Create New Quiz';$('quizTitle').value='';$('quizDesc').value='';$('quizCat').value='';return}let {data}=await sb.from('rj_quizzes').select('*').eq('id',id).single();quiz=data;$('editorTitle').textContent='Edit Quiz';$('quizTitle').value=data.title;$('quizDesc').value=data.description||'';$('quizCat').value=data.category||'';$('quizTime').value=data.time_per_question||30;await loadQuestions()}
$('saveMeta').onclick=async()=>{let title=$('quizTitle').value.trim();if(!title)return $('editMsg').textContent='Enter a quiz title.';if(!editing){let code=String(Math.floor(100000+Math.random()*900000));let {data,error}=await sb.from('rj_quizzes').insert({title,code,host_user:user.id,description:$('quizDesc').value.trim(),category:$('quizCat').value.trim(),time_per_question:+$('quizTime').value,status:'draft',phase:'waiting'}).select().single();if(error)return $('editMsg').textContent=error.message;editing=data.id;quiz=data;$('questionEditor').classList.remove('hide');$('editorTitle').textContent='Edit Quiz'}else{let {error}=await sb.from('rj_quizzes').update({title,description:$('quizDesc').value.trim(),category:$('quizCat').value.trim(),time_per_question:+$('quizTime').value,updated_at:new Date().toISOString()}).eq('id',editing);if(error)return $('editMsg').textContent=error.message}$('editMsg').textContent='Quiz saved.'};
async function loadQuestions(){let {data}=await sb.from('rj_questions').select('*').eq('quiz_id',editing).order('position');questions=data||[];$('qCount').textContent=questions.length;$('qList').innerHTML=questions.map((q,i)=>'<div><b>'+(i+1)+'. '+esc(q.question)+'</b></div>').join('')}
$('addQ').onclick=async()=>{let o=[$('oa').value,$('ob').value,$('oc').value,$('od').value],text=$('qText').value.trim();if(!text||o.some(x=>!x.trim()))return $('editMsg').textContent='Complete the question and all 4 options.';let {error}=await sb.from('rj_questions').insert({quiz_id:editing,position:questions.length,question:text,options:o,correct_index:+$('correct').value});if(error)return $('editMsg').textContent=error.message;['qText','oa','ob','oc','od'].forEach(x=>$(x).value='');await loadQuestions()};
window.openQuiz=async id=>{let {data}=await sb.from('rj_quizzes').select('*').eq('id',id).eq('host_user',user.id).single();quiz=data;view('control');$('controlTitle').textContent=quiz.title;$('controlCode').textContent=quiz.code;await refreshLive();subscribe();};
$('editQuiz').onclick=()=>openEditor(quiz.id);
$('deleteQuiz').onclick=async()=>{if(!confirm('Delete this quiz permanently?'))return;await sb.from('rj_quizzes').delete().eq('id',quiz.id).eq('host_user',user.id);await loadDashboard()};
async function refreshLive(){if(!quiz)return;let q=await sb.from('rj_quizzes').select('*').eq('id',quiz.id).single();if(q.data)quiz=q.data;let a=await sb.from('rj_questions').select('*').eq('quiz_id',quiz.id).order('position');questions=a.data||[];let p=await sb.from('rj_participants').select('*').eq('quiz_id',quiz.id).order('score',{ascending:false});participants=p.data||[];renderLive()}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('quiz-'+quiz.id).on('postgres_changes',{event:'*',schema:'public',table:'rj_quizzes',filter:'id=eq.'+quiz.id},refreshLive).on('postgres_changes',{event:'*',schema:'public',table:'rj_participants',filter:'quiz_id=eq.'+quiz.id},refreshLive).subscribe()}
$('showViewer').onclick=()=>{let url=location.origin+location.pathname+'?quiz='+quiz.code;$('viewer').classList.remove('hide');$('viewer').innerHTML='<h2>Join the Quiz</h2><div id="qr"></div><div class="code">'+esc(quiz.code)+'</div><p>Scan QR or enter the code</p><p>Waiting for host to start…</p>';new QRCode($('qr'),{text:url,width:220,height:220})};
async function state(phase,index=quiz.current_question){await sb.from('rj_quizzes').update({phase,current_question:index,phase_started_at:new Date().toISOString(),status:'live',updated_at:new Date().toISOString()}).eq('id',quiz.id).eq('host_user',user.id)}
$('startQuiz').onclick=()=>questions.length?state('read',0):alert('Add questions first.');$('showAnswer').onclick=()=>quiz.phase==='locked'&&state('answer');$('showBoard').onclick=()=>['locked','answer'].includes(quiz.phase)&&state('leaderboard');$('nextQ').onclick=()=>quiz.current_question+1<questions.length?state('read',quiz.current_question+1):state('leaderboard');$('prevQ').onclick=()=>quiz.current_question>0&&state('read',quiz.current_question-1);
function renderLive(){if(!quiz)return;$('participantCount').textContent=participants.length;$('participantList').innerHTML=participants.map((p,i)=>'<div class="row"><span>#'+(i+1)+' '+esc(p.name)+' <span class="muted">'+esc(p.department)+'</span></span><b>'+p.score+'</b></div>').join('');let active=quiz.current_question>=0&&questions[quiz.current_question];['prevQ','nextQ'].forEach(x=>$(x).classList.toggle('hide',!active));$('showAnswer').classList.toggle('hide',quiz.phase!=='locked');$('showBoard').classList.toggle('hide',!['locked','answer'].includes(quiz.phase));if(!active)return;if(!$('viewer').classList.contains('hide'))renderViewer(active);if(me)renderPlayer(active)}
function renderViewer(q){let elapsed=(Date.now()-new Date(quiz.phase_started_at).getTime())/1000,h='<div class="muted">QUESTION '+(quiz.current_question+1)+' / '+questions.length+'</div><div class="question">'+esc(q.question)+'</div>';if(quiz.phase==='read'){let l=Math.max(0,10-Math.floor(elapsed));h+='<div class="timer">'+l+'</div><p>Reading Time</p>';if(l<=0)state('options')}else if(quiz.phase==='options'){let l=Math.max(0,(quiz.time_per_question||30)-Math.floor(elapsed));h+='<div class="timer">'+l+'</div><div class="opts">'+q.options.map((o,i)=>'<div class="opt">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>').join('')+'</div>';if(l<=0)state('locked')}else if(quiz.phase==='locked')h+='<h2>Time Over</h2><p>Show Answer is ready.</p>';else if(quiz.phase==='answer')h+='<div class="opts">'+q.options.map((o,i)=>'<div class="opt '+(i===q.correct_index?'correct':'')+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>').join('')+'</div>';else if(quiz.phase==='leaderboard')h=boardHTML();$('viewer').innerHTML=h;schedule()}
function boardHTML(){let p=participants;return '<h1>Leaderboard</h1><div class="podium">'+(p[1]?'<div class="pod">🥈<br><b>'+esc(p[1].name)+'</b><br>'+p[1].score+' pts</div>':'')+(p[0]?'<div class="pod first">🏆<br><b>'+esc(p[0].name)+'</b><br>'+p[0].score+' pts</div>':'')+(p[2]?'<div class="pod">🥉<br><b>'+esc(p[2].name)+'</b><br>'+p[2].score+' pts</div>':'')+'</div>'+p.slice(3).map((x,i)=>'<div class="row"><span>#'+(i+4)+' '+esc(x.name)+'</span><b>'+x.score+' pts</b></div>').join('')}
$('joinBtn').onclick=async()=>{let n=$('name').value.trim(),d=$('dept').value,c=$('joinCode').value.trim();if(!n||!d||!c)return $('joinMsg').textContent='Complete all details.';let {data:q}=await sb.from('rj_quizzes').select('*').eq('code',c).maybeSingle();if(!q)return $('joinMsg').textContent='Quiz code not found.';quiz=q;let {data:p,error}=await sb.from('rj_participants').insert({quiz_id:q.id,name:n,department:d}).select().single();if(error)return $('joinMsg').textContent=error.message;me=p;view('player');$('playerName').textContent=n;$('playerDept').textContent=d;subscribe();await refreshLive()};
async function choose(i){if(myAnswer||quiz.phase!=='options')return;let q=questions[quiz.current_question],sec=(Date.now()-new Date(quiz.phase_started_at))/1000,pts=i===q.correct_index&&sec<=20?Math.max(1,11-Math.ceil(sec/2)):0;myAnswer={selected_index:i,points:pts};let {error}=await sb.from('rj_answers').insert({quiz_id:quiz.id,question_id:q.id,participant_id:me.id,selected_index:i,points:pts});if(error){myAnswer=null;return}await sb.from('rj_participants').update({score:me.score+pts}).eq('id',me.id);await refreshLive()}window.choose=choose;
function renderPlayer(q){me=participants.find(x=>x.id===me.id)||me;$('playerScore').textContent=me.score;let elapsed=(Date.now()-new Date(quiz.phase_started_at))/1000,h='';if(quiz.phase==='read'){let l=Math.max(0,10-Math.floor(elapsed));h='<div class="timer">'+l+'</div><div class="question">'+esc(q.question)+'</div><p>Read carefully. Options appear after 10 seconds.</p>'}else if(quiz.phase==='options'){let l=Math.max(0,(quiz.time_per_question||30)-Math.floor(elapsed));h='<div class="timer">'+l+'</div><div class="question">'+esc(q.question)+'</div><div class="opts">'+q.options.map((o,i)=>'<button '+(myAnswer?'disabled':'')+' class="opt '+(myAnswer&&myAnswer.selected_index===i?'selected':'')+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>'}else if(quiz.phase==='locked')h='<h2>Time Over</h2><p>Waiting for host to show the answer…</p>';else if(quiz.phase==='answer')h='<div class="question">'+esc(q.question)+'</div><div class="opts">'+q.options.map((o,i)=>'<div class="opt '+(i===q.correct_index?'correct':myAnswer&&myAnswer.selected_index===i?'wrong':'')+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>').join('')+'</div><h2>'+(myAnswer&&myAnswer.selected_index===q.correct_index?'+'+myAnswer.points+' points':'0 points')+'</h2>';else if(quiz.phase==='leaderboard')h=boardHTML();$('playerView').innerHTML=h;schedule()}
function schedule(){clearTimeout(tickTimer);tickTimer=setTimeout(()=>{if(me&&quiz.current_question>=0)renderPlayer(questions[quiz.current_question]);if(!$('viewer').classList.contains('hide')&&quiz.current_question>=0)renderViewer(questions[quiz.current_question])},250)}
(async()=>{let code=new URLSearchParams(location.search).get('quiz');if(code){$('joinCode').value=code;$('joinCode').readOnly=true;$('joinMsg').textContent='Quiz found. Enter name and department.'}let {data}=await sb.auth.getSession();if(data.session){user=data.session.user;hostUI()}})();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJ Club Quiz</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900}.brand small{display:block;font-size:11px;color:#70798a;letter-spacing:1px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:12px;padding:24px;box-shadow:0 8px 24px #15213a0d}.auth{max-width:450px;margin:7vh auto}.hide{display:none}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.field{width:100%;padding:13px;border:1px solid #cbd2dc;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:12px 15px;background:#243d70;color:#fff;font-weight:800;cursor:pointer}.full{width:100%;margin-top:18px}.link{border:0;background:none;color:#243d70;font-weight:800;cursor:pointer}.muted{color:#747e8f}.code{font-size:29px;font-weight:900;letter-spacing:4px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.opt{padding:15px;border:1px solid #cbd2dc;border-radius:9px;background:#fff;text-align:left;font-weight:700}.selected{border:2px solid #243d70;background:#eef2fa}.correct{border-color:#198754;background:#eaf8ef}.wrong{border-color:#c83d3d;background:#fff0f0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.list>div{padding:10px 0;border-bottom:1px solid #edf0f4}.center{text-align:center;padding:32px 4px}.question{font-size:24px;font-weight:850;margin:18px 0}.timer{font-size:38px;font-weight:900}@media(max-width:600px){.opts{grid-template-columns:1fr}.wrap{padding:13px}.question{font-size:20px}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="supabase-config.js"></script></head>
<body><div class="wrap"><header class="head"><div class="brand">RJ CLUB<small>QUIZ CHALLENGE</small></div><button id="switch" class="link">Host</button></header>
<section id="join" class="card auth"><h2>Join Quiz</h2><label>Name</label><input id="name" class="field"><label>Department</label><select id="dept" class="field"><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>AI & DS</option></select><label>Quiz Code</label><input id="code" class="field" inputmode="numeric"><button id="joinBtn" class="btn full">JOIN QUIZ</button><p id="joinMsg" class="muted"></p></section>
<section id="hostLogin" class="card auth hide"><h2>Host</h2><p class="muted">Realtime test mode</p><button id="hostBtn" class="btn full">OPEN HOST DASHBOARD</button></section>
<section id="host" class="hide"><div class="card"><div class="row"><div><small class="muted">QUIZ CODE</small><div id="hostCode" class="code">------</div></div><button id="newQuiz" class="btn">New Quiz</button></div><div class="tools"><button id="saveQuiz" class="btn">Save Quiz</button><button id="qrBtn" class="btn">Show QR</button></div><div id="qrBox" class="center hide"><canvas id="qrCanvas"></canvas><p><b id="joinLink"></b></p><p class="muted">Scan to join directly</p></div><h2>Add Question</h2><textarea id="q" class="field" placeholder="Question"></textarea><div class="opts"><input id="a" class="field" placeholder="A"><input id="b" class="field" placeholder="B"><input id="c" class="field" placeholder="C"><input id="d" class="field" placeholder="D"></div><label>Correct answer</label><select id="correct" class="field"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><div class="tools"><button id="add" class="btn">Add Question</button><button id="start" class="btn">Start</button><button id="show" class="btn">Show Answer</button><button id="board" class="btn">Leaderboard</button><button id="next" class="btn">Next</button></div><h3>Participants (<span id="count">0</span>)</h3><div id="people" class="list"></div><p>Questions: <b id="qcount">0</b></p><p id="hostMsg" class="muted"></p></div></section>
<section id="player" class="hide"><div class="card"><div class="row"><div><b id="pname"></b><div id="pdept" class="muted"></div></div><div><small>POINTS</small><div id="score" style="font-size:24px;font-weight:900">0</div></div></div><div id="content" class="center"></div></div></section></div>
<script>
const $=id=>document.getElementById(id), sb=supabase.createClient(window.RJ_SUPABASE_URL,window.RJ_SUPABASE_KEY);let quiz=null,questions=[],participants=[],me=null,answer=null,timer=null,sub=null;
function view(v){['join','hostLogin','host','player'].forEach(x=>$(x).classList.toggle('hide',x!==v))}
$('switch').onclick=()=>view('hostLogin');$('hostBtn').onclick=async()=>{view('host');await ensureQuiz();subscribe();await refresh()};
async function ensureQuiz(){let id=localStorage.rjHostQuiz;if(id){let {data}=await sb.from('rj_quizzes').select('*').eq('id',id).maybeSingle();if(data){quiz=data;return}}await createQuiz()}
async function createQuiz(){let code=String(Math.floor(100000+Math.random()*900000));let {data,error}=await sb.from('rj_quizzes').insert({code,title:'RJ Club Quiz'}).select().single();if(error)return $('hostMsg').textContent=error.message;quiz=data;localStorage.rjHostQuiz=quiz.id;await refresh()}
$('newQuiz').onclick=async()=>{localStorage.removeItem('rjHostQuiz');await createQuiz()};
$('saveQuiz').onclick=async()=>{if(!quiz)return;await sb.from('rj_quizzes').update({status:'waiting',phase:'waiting',current_question:-1,updated_at:new Date().toISOString()}).eq('id',quiz.id);$('hostMsg').textContent='Quiz saved. Participants can join and wait.';await refresh()};
$('qrBtn').onclick=()=>{if(!quiz)return;let url=location.origin+location.pathname+'?quiz='+encodeURIComponent(quiz.code);$('qrBox').classList.remove('hide');$('joinLink').textContent=url;QRCode.toCanvas($('qrCanvas'),url,{width:260,margin:2})};
async function refresh(){if(!quiz)return;let q=await sb.from('rj_quizzes').select('*').eq('id',quiz.id).single();if(q.data)quiz=q.data;let qs=await sb.from('rj_questions').select('*').eq('quiz_id',quiz.id).order('position');questions=qs.data||[];let ps=await sb.from('rj_participants').select('*').eq('quiz_id',quiz.id).order('score',{ascending:false});participants=ps.data||[];render()}
function subscribe(){if(sub)sb.removeChannel(sub);sub=sb.channel('rj-'+quiz.id).on('postgres_changes',{event:'*',schema:'public',table:'rj_quizzes',filter:'id=eq.'+quiz.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'rj_participants',filter:'quiz_id=eq.'+quiz.id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'rj_questions',filter:'quiz_id=eq.'+quiz.id},refresh).subscribe()}
$('add').onclick=async()=>{let o=[$('a').value,$('b').value,$('c').value,$('d').value];if(!$('q').value.trim()||o.some(x=>!x.trim()))return;let {error}=await sb.from('rj_questions').insert({quiz_id:quiz.id,position:questions.length,question:$('q').value.trim(),options:o,correct_index:+$('correct').value});if(error)return $('hostMsg').textContent=error.message;['q','a','b','c','d'].forEach(x=>$(x).value='');await refresh()};
async function state(phase,index=quiz.current_question){await sb.from('rj_quizzes').update({phase,current_question:index,phase_started_at:new Date().toISOString(),status:phase==='ended'?'ended':'live'}).eq('id',quiz.id)}
$('start').onclick=()=>questions.length&&state('read',0);$('show').onclick=()=>state('answer');$('board').onclick=()=>state('leaderboard');$('next').onclick=()=>quiz.current_question+1<questions.length?state('read',quiz.current_question+1):state('leaderboard');
$('joinBtn').onclick=async()=>{let n=$('name').value.trim(),d=$('dept').value,c=$('code').value.trim();if(!n||!d||!c)return $('joinMsg').textContent='Complete all details.';let {data:q}=await sb.from('rj_quizzes').select('*').eq('code',c).maybeSingle();if(!q)return $('joinMsg').textContent='Invalid quiz code.';quiz=q;let {data:p,error}=await sb.from('rj_participants').insert({quiz_id:q.id,name:n,department:d}).select().single();if(error)return $('joinMsg').textContent=error.message;me=p;view('player');subscribe();await refresh()};
async function choose(i){if(answer||quiz.phase!=='options')return;let q=questions[quiz.current_question],sec=(Date.now()-new Date(quiz.phase_started_at).getTime())/1000,pts=i===q.correct_index&&sec<=20?Math.max(1,11-Math.ceil(sec/2)):0;answer={selected_index:i,points:pts};let {error}=await sb.from('rj_answers').insert({quiz_id:quiz.id,question_id:q.id,participant_id:me.id,selected_index:i,points:pts});if(error){answer=null;return}await sb.from('rj_participants').update({score:me.score+pts}).eq('id',me.id);await refresh()}
window.choose=choose;
function render(){if(quiz){$('hostCode').textContent=quiz.code;$('qcount').textContent=questions.length;$('count').textContent=participants.length;$('people').innerHTML=participants.map((p,i)=>'<div class="row"><span>#'+(i+1)+' '+p.name+' <small class="muted">'+p.department+'</small></span><b>'+p.score+'</b></div>').join('')}if(!me)return;me=participants.find(p=>p.id===me.id)||me;$('pname').textContent=me.name;$('pdept').textContent=me.department;$('score').textContent=me.score;if(quiz.current_question<0){$('content').innerHTML='<h2>Joined Successfully</h2><p class="muted">Waiting for Host to Start…</p>';return}let q=questions[quiz.current_question];if(!q)return;let elapsed=(Date.now()-new Date(quiz.phase_started_at).getTime())/1000;if(quiz.phase==='read'){let left=Math.max(0,5-Math.floor(elapsed));$('content').innerHTML='<div class="timer">'+left+'</div><div class="question">'+q.question+'</div><p class="muted">Read the question</p>';if(left<=0&&me){sb.from('rj_quizzes').update({phase:'options',phase_started_at:new Date().toISOString()}).eq('id',quiz.id).eq('phase','read').then(()=>{});return}tick();return}if(quiz.phase==='options'){let left=Math.max(0,30-Math.floor(elapsed));$('content').innerHTML='<div class="timer">'+left+'</div><div class="question">'+q.question+'</div><div class="opts">'+q.options.map((o,i)=>'<button class="opt '+(answer&&answer.selected_index===i?'selected':'')+'" '+(answer?'disabled':'')+' onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div>';tick();return}if(quiz.phase==='answer'){$('content').innerHTML='<div class="question">'+q.question+'</div><div class="opts">'+q.options.map((o,i)=>'<button disabled class="opt '+(i===q.correct_index?'correct':answer&&answer.selected_index===i?'wrong':'')+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><h3>'+(answer&&answer.selected_index===q.correct_index?'Correct +'+answer.points:'0 points')+'</h3>';return}if(quiz.phase==='leaderboard'){$('content').innerHTML='<h2>Leaderboard</h2><div class="list">'+participants.map((p,i)=>'<div class="row"><span>#'+(i+1)+' '+p.name+'</span><b>'+p.score+' pts</b></div>').join('')+'</div><p class="muted">Waiting for Host…</p>'}}
function tick(){clearTimeout(timer);timer=setTimeout(render,250)}
(function directJoin(){let code=new URLSearchParams(location.search).get('quiz');if(code){$('code').value=code;$('code').readOnly=true;$('joinMsg').textContent='Quiz found. Enter your name and department to join.'}})();
</script></body></html>
